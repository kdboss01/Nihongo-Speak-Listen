<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nihongo: Speak &amp; Listen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Nihongo: Speak &amp; Listen</h1>
    <p>Sound and meaning only, no kana or kanji to read. Progress saves to a markdown file as you go.</p>
  </header>
  <div class="summary" id="summary"></div>
  <div class="cats" id="cats"></div>
  <div class="card">
    <div class="card-top">
      <span class="tag" id="tag"></span>
      <button class="star-btn" id="masteredBtn" title="Mark mastered">☆</button>
    </div>
    <p class="en" id="en"></p>
    <p class="romaji" id="romaji"></p>
    <div class="actions">
      <button class="action listen-btn" id="listenBtn">🔊 Listen</button>
      <button class="action speak-btn" id="speakBtn">🎤 Say it</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <p class="stats" id="stats"></p>
  </div>
  <div class="nav">
    <button id="prevBtn">← Prev</button>
    <span class="counter" id="counter"></span>
    <button id="nextBtn">Next →</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
